<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="shopify-api-key" content="__SHOPIFY_API_KEY__" />
    <title>Vitaviva Pre-order Shipping</title>
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f6f7;
        --card: #ffffff;
        --border: #e1e3e5;
        --text: #202223;
        --muted: #6d7175;
        --primary: #008060;
        --primary-text: #ffffff;
        --primary-hover: #006e52;
        --danger: #d72c0d;
        --success: #008060;
        --warning: #b98900;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1a1c1e;
          --card: #2a2d30;
          --border: #3a3d40;
          --text: #e3e5e7;
          --muted: #a8aaac;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .container { max-width: 720px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px 0; }
      h2 { font-size: 16px; margin: 0 0 8px 0; }
      .subtitle { color: var(--muted); margin: 0 0 24px 0; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        margin-bottom: 16px;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.05);
      }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
      .row + .row { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
      .label { font-weight: 500; }
      .value { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
      button {
        background: var(--primary);
        color: var(--primary-text);
        border: none;
        border-radius: 6px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s;
      }
      button:hover:not(:disabled) { background: var(--primary-hover); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
      button.secondary:hover:not(:disabled) { background: var(--bg); }
      button.danger { background: var(--danger); }
      button.danger:hover:not(:disabled) { background: #b62408; }
      .badge {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 500;
      }
      .badge.success { background: #cdfee0; color: #0c5132; }
      .badge.warning { background: #ffe1a3; color: #594300; }
      .badge.danger { background: #fed3d1; color: #8e1f0b; }
      .alert {
        padding: 12px 16px;
        border-radius: 6px;
        margin-bottom: 16px;
        font-size: 14px;
      }
      .alert.success { background: #cdfee0; color: #0c5132; border: 1px solid #91e5b5; }
      .alert.danger { background: #fed3d1; color: #8e1f0b; border: 1px solid #ff8a7e; }
      .alert.warning { background: #ffe1a3; color: #594300; border: 1px solid #ffc547; }
      .empty { color: var(--muted); font-style: italic; padding: 12px 0; }
      .help {
        font-size: 13px;
        color: var(--muted);
        margin-top: 8px;
      }
      details { margin-top: 16px; }
      details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
      details summary:hover { color: var(--text); }
      pre {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 4px;
        padding: 12px;
        overflow-x: auto;
        font-size: 12px;
        margin: 8px 0 0 0;
      }
      .spinner {
        display: inline-block;
        width: 14px;
        height: 14px;
        border: 2px solid currentColor;
        border-top-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: -2px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="container" id="app">
      <p style="color: var(--muted)"><span class="spinner"></span> Indlæser…</p>
    </div>

    <script type="module">
      // -------- App Bridge bootstrap --------
      const urlParams = new URLSearchParams(location.search);
      const host = urlParams.get("host");
      const shop = urlParams.get("shop");

      if (!host || !shop) {
        document.getElementById("app").innerHTML = `
          <div class="alert danger">
            <strong>Manglende parametre.</strong> Denne side skal åbnes inde fra Shopify admin
            (med <code>host</code> og <code>shop</code> i URL'en). Hvis du ser denne fejl
            direkte i en browser, prøv at åbne app'en fra Shopify admin igen.
          </div>
        `;
        throw new Error("Missing host/shop query params");
      }

      // Wait for App Bridge global
      const appBridgeReady = new Promise((resolve) => {
        const check = () => {
          if (window.shopify) resolve(window.shopify);
          else setTimeout(check, 50);
        };
        check();
      });

      const sb = await appBridgeReady;

      // -------- API helpers --------
      async function authedFetch(path, init = {}) {
        const token = await sb.idToken();
        const res = await fetch(path, {
          ...init,
          headers: {
            ...(init.headers || {}),
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
            "X-Shopify-Shop": shop,
          },
        });
        let body = null;
        const text = await res.text();
        try {
          body = JSON.parse(text);
        } catch {
          body = { rawText: text };
        }
        return { ok: res.ok, status: res.status, body };
      }

      async function fetchStatus() {
        return authedFetch(`/api/status`);
      }
      async function activate(title) {
        return authedFetch(`/api/activate`, {
          method: "POST",
          body: JSON.stringify({ title }),
        });
      }
      async function deactivate(id) {
        return authedFetch(`/api/deactivate`, {
          method: "POST",
          body: JSON.stringify({ id }),
        });
      }

      // -------- Render helpers --------
      const app = document.getElementById("app");

      function escapeHtml(s) {
        return String(s ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function renderError(err) {
        app.innerHTML = `
          <h1>Vitaviva Pre-order Shipping</h1>
          <p class="subtitle">Fejl under indlæsning</p>
          <div class="alert danger">${escapeHtml(err.message || String(err))}</div>
          <details>
            <summary>Tekniske detaljer</summary>
            <pre>${escapeHtml(JSON.stringify(err, null, 2))}</pre>
          </details>
        `;
      }

      function renderStatus(state) {
        const { function: fn, customizations } = state;

        if (!fn) {
          app.innerHTML = `
            <h1>Vitaviva Pre-order Shipping</h1>
            <p class="subtitle">Function ikke fundet</p>
            <div class="alert danger">
              Kunne ikke finde <code>preorder-shipping-combiner</code> function på din butik.
              Tjek at appen er installeret og at <code>shopify app deploy</code> er kørt.
            </div>
          `;
          return;
        }

        const isActive = customizations.length > 0;

        let customizationRows = "";
        if (isActive) {
          customizationRows = customizations
            .map(
              (c) => `
            <div class="row">
              <div>
                <div class="label">${escapeHtml(c.title)}</div>
                <div class="value">${escapeHtml(c.id)} · ${c.enabled ? "enabled" : "disabled"}</div>
              </div>
              <button class="danger" data-action="deactivate" data-id="${escapeHtml(c.id)}">Fjern</button>
            </div>
          `,
            )
            .join("");
        }

        app.innerHTML = `
          <h1>Vitaviva Pre-order Shipping</h1>
          <p class="subtitle">
            Skjuler "samlet forsendelse" shipping rates på kurve uden pre-order produkter.
          </p>

          <div class="card">
            <h2>Function</h2>
            <div class="row">
              <div>
                <div class="label">${escapeHtml(fn.title)}</div>
                <div class="value">${escapeHtml(fn.id)}</div>
                <div class="value">API: ${escapeHtml(fn.apiType)}</div>
              </div>
              <div>
                ${
                  isActive
                    ? '<span class="badge success">Aktiv</span>'
                    : '<span class="badge warning">Ikke aktiveret</span>'
                }
              </div>
            </div>
          </div>

          ${
            isActive
              ? `
            <div class="card">
              <h2>Customizations (${customizations.length})</h2>
              ${customizationRows}
            </div>
            <div class="alert success">
              <strong>Aktiv.</strong> Functionen kører på alle checkout-kurver.
              Pre-order produkter skal have tagget <code>pre-order</code> for at blive detekteret.
            </div>
          `
              : `
            <div class="card">
              <h2>Aktivér</h2>
              <p>
                Klik nedenfor for at oprette en delivery customization der aktiverer
                <code>preorder-shipping-combiner</code> function på din butik.
              </p>
              <button id="activate-btn">Aktivér nu</button>
              <p class="help">Du kan altid fjerne den igen senere.</p>
            </div>
          `
          }

          <details>
            <summary>Tekniske detaljer</summary>
            <pre>${escapeHtml(JSON.stringify(state, null, 2))}</pre>
          </details>
        `;

        // Wire up buttons
        const activateBtn = document.getElementById("activate-btn");
        if (activateBtn) {
          activateBtn.addEventListener("click", async () => {
            activateBtn.disabled = true;
            activateBtn.innerHTML = '<span class="spinner"></span> Aktiverer…';
            try {
              const result = await activate("Pre-order shipping visibility");
              if (!result.ok) throw new Error(result.body?.error || "Activation failed");
              if (result.body?.userErrors?.length) {
                throw new Error(result.body.userErrors.map((e) => e.message).join("; "));
              }
              await refresh();
            } catch (err) {
              activateBtn.disabled = false;
              activateBtn.textContent = "Aktivér nu";
              const msg = document.createElement("div");
              msg.className = "alert danger";
              msg.textContent = err.message || String(err);
              app.prepend(msg);
            }
          });
        }

        document.querySelectorAll("[data-action='deactivate']").forEach((btn) => {
          btn.addEventListener("click", async () => {
            if (!confirm("Vil du virkelig fjerne customization'en?")) return;
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Fjerner…';
            try {
              const id = btn.dataset.id;
              const result = await deactivate(id);
              if (!result.ok) throw new Error(result.body?.error || "Deactivation failed");
              await refresh();
            } catch (err) {
              btn.disabled = false;
              btn.textContent = "Fjern";
              const msg = document.createElement("div");
              msg.className = "alert danger";
              msg.textContent = err.message || String(err);
              app.prepend(msg);
            }
          });
        });
      }

      async function refresh() {
        try {
          const result = await fetchStatus();
          if (!result.ok) throw new Error(result.body?.error || `HTTP ${result.status}`);
          renderStatus(result.body);
        } catch (err) {
          renderError(err);
        }
      }

      await refresh();
    </script>
  </body>
</html>
